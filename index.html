<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังลิงก์ส่วนตัว (Link Dashboard)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .loader { border-top-color: #800000; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* เอฟเฟกต์ตอนโฮเวอร์การ์ด */
        .link-card { transition: all 0.3s ease; }
        .link-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(128, 0, 0, 0.2); border-color: #800000; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- ส่วนหัว (Header) -->
        <header class="bg-[#800000] text-white p-6 md:p-8 rounded-2xl shadow-lg mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-3xl font-bold"><i class="fas fa-layer-group mr-2"></i> Dashboard คลังลิงก์</h1>
                <p class="text-gray-200 text-sm mt-2">ระบบจัดการและรวบรวมเว็บไซต์สำคัญ เปิดใช้งานได้จากทุกอุปกรณ์</p>
            </div>
            <div class="bg-white/20 px-4 py-2 rounded-lg backdrop-blur-sm">
                <p class="text-sm">จำนวนลิงก์ทั้งหมด: <span id="linkCount" class="font-bold text-lg">0</span></p>
            </div>
        </header>

        <!-- ส่วนเพิ่มลิงก์ใหม่ -->
        <div class="bg-white p-6 rounded-2xl shadow-md mb-8 border-t-4 border-[#800000]">
            <h2 class="text-lg font-semibold text-gray-800 mb-4"><i class="fas fa-plus-circle text-[#800000] mr-2"></i>เพิ่มลิงก์ใหม่</h2>
            <form id="addLinkForm" class="flex flex-col md:flex-row gap-4">
                <input type="text" id="linkName" required placeholder="พิมพ์ชื่อเว็บไซต์ หรือคำอธิบาย..." 
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#800000] focus:border-transparent bg-gray-50">
                <input type="url" id="linkUrl" required placeholder="https://..." 
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#800000] focus:border-transparent bg-gray-50">
                <button type="submit" id="submitBtn" 
                    class="bg-[#800000] hover:bg-red-900 text-white px-8 py-3 rounded-lg font-medium transition-colors duration-200 flex items-center justify-center shadow-md">
                    <i class="fas fa-save mr-2"></i> <span>บันทึก</span>
                </button>
            </form>
        </div>

        <!-- ส่วนค้นหาและแสดงผล (Dashboard) -->
        <div class="bg-white p-6 rounded-2xl shadow-md">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-th-large text-[#800000] mr-2"></i> ลิงก์ที่บันทึกไว้</h2>
                
                <!-- ช่องค้นหา -->
                <div class="relative w-full md:w-72">
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อลิงก์..." 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-[#800000] focus:border-transparent bg-gray-50">
                    <i class="fas fa-search absolute left-4 top-3 text-gray-400"></i>
                </div>
            </div>

            <!-- ไอคอนโหลดข้อมูล -->
            <div id="loading" class="flex flex-col justify-center items-center py-12">
                <div class="loader ease-linear rounded-full border-4 border-gray-200 h-12 w-12 mb-4"></div>
                <p class="text-gray-500 text-sm">กำลังดึงข้อมูลจากฐานข้อมูล...</p>
            </div>

            <!-- พื้นที่แสดงการ์ดลิงก์ -->
            <div id="linksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 hidden">
                <!-- ข้อมูลลิงก์จะถูกดึงมาแสดงที่นี่ผ่าน JavaScript -->
            </div>
            
            <!-- กรณีไม่พบข้อมูล -->
            <div id="noDataMessage" class="hidden text-center py-12 text-gray-500">
                <i class="fas fa-folder-open text-4xl mb-3 text-gray-300"></i>
                <p>ยังไม่มีข้อมูลลิงก์ หรือค้นหาไม่พบ</p>
            </div>
        </div>
    </div>

    <script>
        // URL ของ Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxbvfjq-aavduBQlaWxwEkVyBeDqD3oIog5KiIwyXzekBmM6S-tRbyHc4-6whjrAHk/exec';

        const linksContainer = document.getElementById('linksContainer');
        const addLinkForm = document.getElementById('addLinkForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const searchInput = document.getElementById('searchInput');
        const linkCountDisplay = document.getElementById('linkCount');
        const noDataMessage = document.getElementById('noDataMessage');

        let allLinks = []; // ตัวแปรเก็บลิงก์ทั้งหมดเพื่อใช้ในการค้นหา

        // ฟังก์ชันดึงข้อมูลจาก Google Sheets
        async function fetchLinks() {
            loading.classList.remove('hidden');
            linksContainer.classList.add('hidden');
            noDataMessage.classList.add('hidden');
            
            try {
                const response = await fetch(SCRIPT_URL, { redirect: 'follow' });
                allLinks = await response.json();
                renderLinks(allLinks); // เรียกใช้ฟังก์ชันแสดงผล
            } catch (error) {
                console.error('Error fetching links:', error);
                loading.classList.add('hidden');
                noDataMessage.innerHTML = '<p class="text-red-500"><i class="fas fa-exclamation-triangle mr-2"></i> เกิดข้อผิดพลาดในการดึงข้อมูล</p>';
                noDataMessage.classList.remove('hidden');
            }
        }

        // ฟังก์ชันวาดการ์ดแสดงผลบน Dashboard
        function renderLinks(linksToRender) {
            loading.classList.add('hidden');
            
            linkCountDisplay.innerText = linksToRender.length;

            if (linksToRender.length === 0) {
                linksContainer.classList.add('hidden');
                noDataMessage.classList.remove('hidden');
                return;
            }

            noDataMessage.classList.add('hidden');
            linksContainer.classList.remove('hidden');
            
            linksContainer.innerHTML = linksToRender.map(link => `
                <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
                   class="link-card bg-white p-5 rounded-xl border border-gray-200 flex items-center justify-between group">
                    <div class="flex flex-col w-5/6">
                        <div class="flex items-center mb-1">
                            <div class="w-8 h-8 rounded-full bg-red-50 text-[#800000] flex items-center justify-center mr-3 shrink-0">
                                <i class="fas fa-link"></i>
                            </div>
                            <h3 class="font-bold text-gray-800 group-hover:text-[#800000] truncate text-lg">${link.name}</h3>
                        </div>
                        <p class="text-xs text-gray-400 truncate pl-11">${link.url}</p>
                    </div>
                    <div class="w-1/6 flex justify-end text-gray-300 group-hover:text-[#800000]">
                        <i class="fas fa-external-link-alt text-xl"></i>
                    </div>
                </a>
            `).join('');
        }

        // ฟังก์ชันค้นหาลิงก์แบบ Real-time
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredLinks = allLinks.filter(link => 
                link.name.toLowerCase().includes(searchTerm) || 
                link.url.toLowerCase().includes(searchTerm)
            );
            renderLinks(filteredLinks);
        });

        // ฟังก์ชันบันทึกลิงก์ใหม่
        addLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('linkName').value;
            const url = document.getElementById('linkUrl').value;
            
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังบันทึก...';
            submitBtn.disabled = true;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ name, url }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                addLinkForm.reset();
                searchInput.value = ''; // ล้างค่าค้นหา
                fetchLinks(); // ดึงข้อมูลใหม่มาแสดงทันที
            } catch (error) {
                console.error('Error saving link:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        });

        // โหลดข้อมูลอัตโนมัติเมื่อเปิดหน้าเว็บ
        fetchLinks();
    </script>
</body>
</html>
